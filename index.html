<script>
/* ============================================================================
   NUBE / SINCRONIZACIÓN (v85)
   Portado del módulo probado de Diario de Hábitos. Sin librerías externas: todo
   con fetch a la API REST/Auth de Supabase. Reutiliza el MISMO proyecto que
   Hábitos/Calma; 'app_id' separa los datos de esta app en la tabla común
   app_state. El servidor (tabla + RLS user_id=auth.uid() + login) YA existe.
   Estrategia: ESTADO COMPLETO + conflicto explícito (igual que Hábitos/Calma).
   ========================================================================== */
(function(){
  'use strict';
  var CLOUD_CFG = {
    url:     'https://tyfqmnfcmbljfginqebc.supabase.co',
    anonKey: 'sb_publishable_ZnVZTzFrOf7q72AAWSqdNw_AbUa5wze',
    appId:   'rueda'
  };
  /* las 7 cosas que la app guarda en window.storage (todo lo sincronizable) */
  var SYNC_KEYS = ['color_wheel_palettes_v1','color_wheel_v1','color_wheel_theme_v1',
                   'color_wheel_keys_v1','color_wheel_palpref_v1','color_wheel_gridpref_v1',
                   'color_wheel_lut_v1'];
  var SESS_KEY      = 'color_wheel_cloud_session_v1';
  var META_KEY      = 'color_wheel_sync_v1';
  var PREBK_KEY     = 'color_wheel_prebackup_v1';
  var PREBK_FLAG    = 'color_wheel_prebackup_done_v1';

  var CLOUD = { session:null, meta:{lastLocalChange:0,lastSyncedAt:0,lastRemoteUpdatedAt:0},
                busy:false, status:'off', fails:0, lastError:'', applying:false };
  var cloudReady = false;

  function CL(es,en){ try{ return (typeof LANG!=='undefined' && LANG==='en') ? en : es; }catch(e){ return es; } }
  function cloudToast(t){ try{ if(typeof toast==='function') toast(t); }catch(e){} }
  function cloudConfigured(){ return !!(CLOUD_CFG.url && CLOUD_CFG.anonKey); }
  function sget(k){ return window.storage.get(k).then(function(r){return r&&r.value?r.value:null;}); }
  function sset(k,v){ return window.storage.set(k,v); }

  /* decisión de sync (pura). !== y no >: un reloj adelantado no debe pisar sin conflicto. */
  function cloudDecide(meta, remote){
    var localChanged = meta.lastLocalChange > meta.lastSyncedAt;
    if(!remote) return (localChanged || meta.lastSyncedAt===0) ? 'push' : 'none';
    var remoteChanged = remote.updated_ms !== meta.lastRemoteUpdatedAt;
    if(remoteChanged && localChanged) return 'conflict';
    if(remoteChanged) return 'pull';
    if(localChanged) return 'push';
    return 'none';
  }

  function cloudNetFail(e){ CLOUD.fails=(CLOUD.fails||0)+1; }
  function cloudNetOk(){ CLOUD.fails=0; }

  function cloudApi(path, opts){
    var o = opts || {};
    var headers = Object.assign({'apikey':CLOUD_CFG.anonKey,'Content-Type':'application/json'}, o.headers||{});
    if(CLOUD.session && CLOUD.session.access_token && !o.noAuth) headers['Authorization']='Bearer '+CLOUD.session.access_token;
    return fetch(CLOUD_CFG.url.replace(/\/+$/,'')+path, {method:o.method||'GET', headers:headers, body:o.body?JSON.stringify(o.body):undefined})
      .then(function(res){
        if(res.status===401 && !o.retried && CLOUD.session && CLOUD.session.refresh_token){
          return cloudRefresh().then(function(ok){ if(ok) return cloudApi(path, Object.assign({},o,{retried:true})); return finish(res); });
        }
        return finish(res);
      }, function(e){ cloudNetFail(e); throw e; });
    function finish(res){
      if(res.status>=500) cloudNetFail(); else cloudNetOk();
      return res.text().then(function(txt){
        var data=null; try{ data = txt?JSON.parse(txt):null; }catch(e){ data = txt; }
        if(!res.ok) throw new Error((data && (data.msg||data.message||data.error_description)) || ('HTTP '+res.status));
        return data;
      });
    }
  }
  function cloudRefresh(){
    return cloudApi('/auth/v1/token?grant_type=refresh_token', {method:'POST', noAuth:true, body:{refresh_token:CLOUD.session.refresh_token}})
      .then(function(d){
        CLOUD.session = {access_token:d.access_token, refresh_token:d.refresh_token, email:(d.user&&d.user.email)||CLOUD.session.email, user_id:(d.user&&d.user.id)||CLOUD.session.user_id};
        return sset(SESS_KEY, JSON.stringify(CLOUD.session)).then(function(){return true;});
      }).catch(function(){ return false; });
  }
  function cloudSaveSession(d, email){
    if(!d || !d.access_token) throw new Error(CL('Supabase no devolvió sesión. Revisa que «Confirm email» esté desactivado.','Supabase returned no session. Check that “Confirm email” is off.'));
    CLOUD.session = {access_token:d.access_token, refresh_token:d.refresh_token, email:(d.user&&d.user.email)||email, user_id:d.user&&d.user.id};
    return sset(SESS_KEY, JSON.stringify(CLOUD.session));
  }
  function cloudSignUp(email, pw){ return cloudApi('/auth/v1/signup', {method:'POST', noAuth:true, body:{email:email, password:pw}}).then(function(d){ return cloudSaveSession(d, email); }); }
  function cloudSignIn(email, pw){ return cloudApi('/auth/v1/token?grant_type=password', {method:'POST', noAuth:true, body:{email:email, password:pw}}).then(function(d){ return cloudSaveSession(d, email); }); }
  function cloudDisconnect(){ CLOUD.session=null; CLOUD.status='off'; return sset(SESS_KEY,'').catch(function(){}); }

  /* PUENTE con los datos de la app: leer/escribir las 7 claves de window.storage */
  function cloudGetState(){
    return Promise.all(SYNC_KEYS.map(function(k){
      return sget(k).then(function(raw){
        var val=null; if(raw!=null){ try{ val=JSON.parse(raw); }catch(e){ val=raw; } }
        return [k,val];
      });
    })).then(function(pairs){ var d={}; pairs.forEach(function(p){ d[p[0]]=p[1]; }); return {v:1, keys:d}; });
  }
  function cloudSetState(blob){
    var keys=(blob&&blob.keys)||{};
    CLOUD.applying=true;
    return Promise.all(SYNC_KEYS.map(function(k){
      if(keys[k]==null) return Promise.resolve();
      var s; try{ s=(typeof keys[k]==='string')?keys[k]:JSON.stringify(keys[k]); }catch(e){ return Promise.resolve(); }
      return sset(k, s);
    })).then(function(){ CLOUD.applying=false; }, function(){ CLOUD.applying=false; });
  }
  /* recarga en memoria y repinta la vista activa tras un pull */
  function cloudRerender(){
    var ps=[];
    ['loadStore','loadPal','loadPalPref','loadGridPref','loadLutPref','loadKeys','loadTheme'].forEach(function(fn){
      try{ if(typeof window[fn]==='function') ps.push(Promise.resolve(window[fn]()).catch(function(){})); }catch(e){}
    });
    return Promise.all(ps).then(function(){
      try{ if(typeof applyTheme==='function') applyTheme(); }catch(e){}
      try{
        var on=document.querySelector('#tabs .tab.on'); var t=on?on.dataset.tab:'';
        var map={harm:'renderHarm',pal:'renderPal',grid:'renderGrid',theory:'renderTheory',tools:'renderTools',study:'renderStudyHome'};
        if(t==='wheel'){ if(typeof updateModelUI==='function') updateModelUI(); if(typeof mountWheel==='function') mountWheel(); }
        else if(map[t] && typeof window[map[t]]==='function') window[map[t]]();
      }catch(e){}
      try{ if(typeof renderFooter==='function') renderFooter(); }catch(e){}
    });
  }

  function cloudSaveMeta(){ try{ return sset(META_KEY, JSON.stringify(CLOUD.meta)); }catch(e){ return Promise.resolve(); } }
  function cloudMarkLocalChange(){ CLOUD.meta.lastLocalChange = Date.now(); cloudSaveMeta(); }

  /* copia previa a la PRIMERA fusión, una vez por dispositivo (§7.5) */
  function cloudPreMergeBackup(){
    return sget(PREBK_FLAG).then(function(done){
      if(done) return;
      return cloudGetState().then(function(st){
        return sset(PREBK_KEY, JSON.stringify({when:Date.now(), state:st}))
          .then(function(){ return sset(PREBK_FLAG,'1'); })
          .then(function(){ try{ cloudDownloadBackup(st); }catch(e){} cloudToast(CL('Guardada una copia de tus datos antes de la primera sincronización.','Saved a backup of your data before the first sync.')); });
      });
    }).catch(function(){});
  }
  function cloudDownloadBackup(st){
    try{
      var blob=new Blob([JSON.stringify(st,null,2)],{type:'application/json'});
      var url=URL.createObjectURL(blob);
      var a=document.createElement('a'); a.href=url; a.download='rueda-copia-antes-de-nube.json';
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(function(){ URL.revokeObjectURL(url); }, 1500);
    }catch(e){}
  }

  function cloudFetchRemote(){
    return cloudApi('/rest/v1/app_state?app_id=eq.'+encodeURIComponent(CLOUD_CFG.appId)+'&select=data,updated_at')
      .then(function(rows){ if(!rows || !rows.length) return null; return {data:rows[0].data, updated_ms:Date.parse(rows[0].updated_at)||0}; });
  }
  function cloudPush(){
    var now = new Date().toISOString();
    return cloudGetState().then(function(st){
      return cloudApi('/rest/v1/app_state', {method:'POST',
        headers:{'Prefer':'resolution=merge-duplicates,return=minimal'},
        body:[{user_id:CLOUD.session.user_id, app_id:CLOUD_CFG.appId, data:st, updated_at:now}]});
    }).then(function(){
      CLOUD.meta.lastSyncedAt = Date.now();
      CLOUD.meta.lastRemoteUpdatedAt = Date.parse(now);
      return cloudSaveMeta();
    });
  }
  function cloudPull(remote){
    return cloudPreMergeBackup().then(function(){ return cloudSetState(remote.data); }).then(function(){
      CLOUD.meta.lastSyncedAt = Date.now();
      CLOUD.meta.lastLocalChange = CLOUD.meta.lastSyncedAt;
      CLOUD.meta.lastRemoteUpdatedAt = remote.updated_ms;
      return cloudSaveMeta();
    }).then(function(){ return cloudRerender(); });
  }

  function cloudSync(opts){
    var o = opts || {};
    if(!cloudConfigured() || !CLOUD.session || CLOUD.busy) return Promise.resolve();
    CLOUD.busy=true; CLOUD.status='sync'; renderCloud();
    return cloudFetchRemote().then(function(remote){
      var action = cloudDecide(CLOUD.meta, remote);
      if(o.force) action = o.force;
      if(action==='conflict'){ CLOUD.status='conflict'; CLOUD.busy=false; renderCloud(); cloudShowConflict(remote); return; }
      var p = (action==='push') ? cloudPush() : (action==='pull' ? cloudPull(remote) : Promise.resolve());
      return p.then(function(){ CLOUD.status='ok'; });
    }).catch(function(e){ CLOUD.status='error'; CLOUD.lastError=(e&&e.message)||String(e); })
      .then(function(){ CLOUD.busy=false; renderCloud(); });
  }

  function cloudInit(){
    if(!cloudConfigured()) return;
    sget(META_KEY).then(function(m){ if(m){ try{ CLOUD.meta=Object.assign(CLOUD.meta, JSON.parse(m)); }catch(e){} } })
      .then(function(){ return sget(SESS_KEY); })
      .then(function(s){ if(s){ try{ CLOUD.session=JSON.parse(s); CLOUD.status='idle'; }catch(e){} } })
      .then(function(){ cloudReady=true; try{ renderCloud(); }catch(e){} if(CLOUD.session) cloudSync(); })
      .catch(function(){ cloudReady=true; });
  }

  /* engancha cambios locales: al escribir cualquiera de las 7 claves, marca cambio */
  (function hookLocalChange(){
    try{
      var _set = window.storage.set.bind(window.storage);
      window.storage.set = function(k,v){
        var r = _set(k,v);
        try{ if(cloudReady && !CLOUD.applying && SYNC_KEYS.indexOf(k)>=0) cloudMarkLocalChange(); }catch(e){}
        return r;
      };
    }catch(e){}
  })();

  /* ---------- UI ---------- */
  var CLOUD_EYE = "<svg viewBox='0 0 24 24' width='18' height='18' fill='none' stroke='currentColor' stroke-width='1.7' stroke-linecap='round' stroke-linejoin='round' aria-hidden='true'><path d='M2 12s3.8-6.5 10-6.5S22 12 22 12s-3.8 6.5-10 6.5S2 12 2 12Z'/><circle cx='12' cy='12' r='3.1'/></svg>";
  function cloudWhen(ms){
    if(!ms) return CL('nunca','never');
    try{ var d=new Date(ms); return d.toLocaleDateString(CL('es-ES','en-GB'),{day:'numeric',month:'short'})+' '+d.toLocaleTimeString(CL('es-ES','en-GB'),{hour:'2-digit',minute:'2-digit'}); }catch(e){ return '—'; }
  }
  function renderCloud(){
    var el=document.getElementById('cloudCard'); if(!el) return;
    var h='<h3>'+CL('Nube · Sincronización','Cloud · Sync')+'</h3>';
    if(!CLOUD.session){
      el.innerHTML = h
        +'<p class="hint">'+CL('Sincroniza tus paletas, progreso del estudio y ajustes entre el móvil y el PC. Entra con el MISMO correo y contraseña que usas en Diario de Hábitos: la primera vez en un dispositivo pulsa «Crear cuenta»; en los demás, «Entrar».','Sync your palettes, study progress and settings between phone and PC. Sign in with the SAME email and password you use in the Habits diary: first time on a device tap “Create account”; on the others, “Sign in”.')+'</p>'
        +'<p class="cbnote" style="margin:0 0 4px">'+CL('El primer dispositivo que conectes sube sus datos; los demás los descargan. Antes de la primera sincronización se guarda una copia por si acaso.','The first device you connect uploads its data; the others download it. A backup is saved before the first sync, just in case.')+'</p>'
        +'<div class="cloud-form"><input id="cloudEmail" type="email" inputmode="email" autocomplete="username" placeholder="'+CL('tu correo','your email')+'" aria-label="'+CL('Correo','Email')+'"></div>'
        +'<div class="cloud-form"><input id="cloudPass" type="password" autocomplete="current-password" placeholder="'+CL('contraseña (mínimo 6)','password (min 6)')+'" aria-label="'+CL('Contraseña','Password')+'"><button class="eye" onclick="cloudTogglePass()" aria-label="'+CL('Mostrar la contraseña','Show password')+'" title="'+CL('Mostrar la contraseña','Show password')+'">'+CLOUD_EYE+'</button></div>'
        +'<div class="cloud-row"><button class="accent" onclick="cloudUiLogin()">'+CL('Entrar','Sign in')+'</button><button onclick="cloudUiSignup()">'+CL('Crear cuenta','Create account')+'</button></div>';
      return;
    }
    var st=CLOUD.status;
    var label={off:CL('Desconectado','Disconnected'), idle:CL('Conectado','Connected'), sync:CL('Sincronizando…','Syncing…'), ok:CL('Al día','Up to date'), error:CL('Error','Error')+': '+(CLOUD.lastError||''), conflict:CL('Hay un conflicto que resolver','A conflict to resolve')}[st]||st;
    el.innerHTML = h
      +'<div class="cloud-state"><span class="cloud-dot '+st+'"></span><span>'+esc(label)+'</span></div>'
      +'<p class="hint">'+CL('Cuenta','Account')+': <b>'+esc(CLOUD.session.email||'')+'</b><br>'+CL('Última sincronización','Last sync')+': '+cloudWhen(CLOUD.meta.lastSyncedAt)+'</p>'
      +'<div class="cloud-row"><button class="accent" onclick="cloudSync()">'+CL('Sincronizar ahora','Sync now')+'</button><button onclick="cloudUiDisconnect()">'+CL('Desconectar','Disconnect')+'</button></div>'
      +'<div id="conflictSlot"></div>';
  }
  function cloudShowConflict(remote){
    renderCloud();
    var slot=document.getElementById('conflictSlot'); if(!slot) return;
    slot.innerHTML='<div class="conflict-box"><h4>'+CL('Dos versiones distintas','Two different versions')+'</h4>'
      +'<p class="hint">'+CL('Este dispositivo cambió el','This device changed on')+' '+cloudWhen(CLOUD.meta.lastLocalChange)+'.<br>'
      +CL('La nube cambió el','The cloud changed on')+' '+cloudWhen(remote.updated_ms)+'.<br>'
      +CL('No elijo por ti. Si quieres, exporta antes una copia con «Copia de seguridad», arriba.','I will not choose for you. If you want, export a backup first with “Backup”, above.')+'</p>'
      +'<div class="opt">'
      +'<button onclick="cloudResolve(this)" data-which="push">'+CL('Mandar lo de este dispositivo','Send this device’s version')+'</button>'
      +'<button onclick="cloudResolve(this)" data-which="pull">'+CL('Traer lo de la nube','Bring the cloud version')+'</button>'
      +'</div></div>';
  }
  function cloudResolve(btnOrWhich){
    var which = (btnOrWhich && btnOrWhich.dataset) ? btnOrWhich.dataset.which : btnOrWhich;
    var msg = which==='push'
      ? CL('La versión de la nube se reemplazará por la de este dispositivo. ¿Seguro?','The cloud version will be replaced by this device’s. Are you sure?')
      : CL('Los datos de este dispositivo se reemplazarán por los de la nube. ¿Seguro?','This device’s data will be replaced by the cloud’s. Are you sure?');
    try{ if(!confirm(msg)) return; }catch(e){}
    var previo = CLOUD.meta.lastRemoteUpdatedAt;
    var p;
    if(which==='push'){ CLOUD.meta.lastRemoteUpdatedAt=0; p=cloudSync({force:'push'}); }
    else { p = cloudFetchRemote().then(function(remote){ if(remote) return cloudPull(remote); }); }
    p.then(function(){
      var slot=document.getElementById('conflictSlot'); if(slot) slot.innerHTML='';
      CLOUD.status='ok'; renderCloud();
    }).catch(function(e){
      CLOUD.meta.lastRemoteUpdatedAt = previo;
      CLOUD.status='error'; CLOUD.lastError=(e&&e.message)||String(e);
      cloudToast(CL('No se pudo resolver: ','Could not resolve: ')+CLOUD.lastError);
      renderCloud();
    });
  }
  function cloudTogglePass(){
    var i=document.getElementById('cloudPass'); if(!i) return;
    i.type = (i.type==='text') ? 'password' : 'text'; i.focus();
  }
  function cloudCreds(){
    var em=((document.getElementById('cloudEmail')||{}).value||'').trim();
    var pw=((document.getElementById('cloudPass')||{}).value||'');
    if(!em){ cloudToast(CL('Escribe tu correo.','Enter your email.')); return null; }
    if(pw.length<6){ cloudToast(CL('La contraseña necesita al menos 6 caracteres.','Password needs at least 6 characters.')); return null; }
    return {em:em, pw:pw};
  }
  function cloudUiLogin(){
    var c=cloudCreds(); if(!c) return;
    cloudSignIn(c.em,c.pw).then(function(){ CLOUD.status='idle'; renderCloud(); cloudToast(CL('Dispositivo conectado.','Device connected.')); cloudSync(); })
      .catch(function(e){ cloudToast(CL('No se pudo entrar: ','Could not sign in: ')+((e&&e.message)||e)); });
  }
  function cloudUiSignup(){
    var c=cloudCreds(); if(!c) return;
    cloudSignUp(c.em,c.pw).then(function(){ CLOUD.status='idle'; renderCloud(); cloudToast(CL('Cuenta creada y dispositivo conectado.','Account created and device connected.')); cloudSync(); })
      .catch(function(e){ cloudToast(CL('No se pudo crear la cuenta: ','Could not create account: ')+((e&&e.message)||e)); });
  }
  function cloudUiDisconnect(){
    var msg=CL('¿Desconectar este dispositivo? Tus datos siguen aquí y en la nube; solo se corta el enlace.','Disconnect this device? Your data stays here and in the cloud; only the link is cut.');
    try{ if(!confirm(msg)) return; }catch(e){}
    cloudDisconnect().then(function(){ renderCloud(); });
  }

  /* exponer lo que usan los onclick y las pruebas */
