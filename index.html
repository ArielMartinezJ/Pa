<!-- v66: CSP ajustada a lo que la app usa DE VERDAD. 'unsafe-inline' en script/style
     es obligatorio mientras el codigo (y los onclick=) vivan dentro del HTML. Sin
     'unsafe-eval' (no hay eval/new Function). Fuentes: solo Google Fonts. img-src
     data:/blob: por las vistas previas de imagen y el PNG del recoloreado. jsdom NO
     aplica la CSP: verificar en el navegador ya desplegada. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://tyfqmnfcmbljfginqebc.supabase.co; manifest-src 'self'; worker-src 'self'; base-uri 'self'; object-src 'none'">

<!-- v54: preconnect + link en vez de @import: el CSS de las fuentes se pide en
     paralelo al parseo del CSS propio (el @import lo serializaba) -->

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
:root{
  --bg:#0E1116;--surface:#161B22;--surface2:#12161D;
  --line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.15);
  /* --faint se usa en pistas, notas y leyendas: debe cumplir WCAG AA (4.5) sobre
     --bg, --surface y --surface2. Medido con Chromium: 4.93 / 4.55 / 4.73 */
  --txt:#EAEEF5;--muted:#9AA4B4;--faint:#788395;
  --disp:'Space Grotesk',ui-sans-serif,system-ui,sans-serif;
  --body:'Inter',ui-sans-serif,system-ui,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,monospace;
}
*{box-sizing:border-box}html,body{margin:0}
body{background:radial-gradient(1200px 800px at 50% -280px,var(--glow,#1a2130) 0%,var(--bg) 60%);color:var(--txt);font-family:var(--body);-webkit-font-smoothing:antialiased;min-height:100vh;line-height:1.5;
 /* v53: safe areas para standalone en iPhone con notch; en escritorio env()=0 */
 padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.updbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom));z-index:80;display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line2);border-radius:12px;padding:10px 14px;font-size:13.5px;color:var(--txt);box-shadow:0 8px 30px rgba(0,0,0,.45)}
.updbar button{background:#8ab4ff;color:#0E1116;border:none;border-radius:9px;padding:8px 14px;font-weight:600;font-size:13px;cursor:pointer}
.undobar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom));z-index:80;display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line2);border-radius:12px;padding:8px 10px 8px 15px;font-size:13.5px;color:var(--txt);box-shadow:0 8px 30px rgba(0,0,0,.45)}
.undobar button{background:#8ab4ff;color:#0E1116;border:none;border-radius:9px;padding:7px 13px;font-weight:600;font-size:13px;cursor:pointer}
.wrap{max-width:1080px;margin:0 auto;padding:22px 16px 70px}
button{font-family:var(--body);cursor:pointer}
.hidden{display:none!important}
header{text-align:center;margin-bottom:14px;position:relative}
.topctrls{position:absolute;top:0;right:0;display:flex;gap:8px;align-items:flex-start;z-index:46}
.langtoggle{display:flex;gap:2px;background:var(--surface);border:1px solid var(--line2);border-radius:9px;padding:3px}
.langtoggle button{background:none;border:none;color:var(--faint);font-family:var(--mono);font-size:12px;font-weight:600;padding:5px 10px;border-radius:6px;transition:.14s}
.langtoggle button.on{background:rgba(138,180,255,.16);color:#cfe0ff}
html.light .langtoggle button.on{background:rgba(43,108,217,.12);color:#1E5BC6}
html.hc .langtoggle button.on{background:#1E5BC6;color:#fff}
html.light.hc .langtoggle button.on{background:#1E5BC6;color:#fff}
@media(max-width:560px){.topctrls{position:static;justify-content:center;margin-bottom:10px}}
#themeWrap{position:relative}
.tbtn{background:var(--surface);border:1px solid var(--line2);border-radius:9px;color:var(--muted);font-size:15px;padding:6px 11px;cursor:pointer;transition:.14s;display:inline-flex;align-items:center;justify-content:center;line-height:1}
.tbtn:hover{color:var(--txt)}
.themepop{position:absolute;top:42px;right:0;width:252px;background:var(--surface);border:1px solid var(--line2);border-radius:13px;padding:13px;box-shadow:0 16px 48px rgba(0,0,0,.45);text-align:left;max-height:calc(100vh - 96px);max-height:calc(100dvh - 96px);overflow-y:auto;overscroll-behavior:contain}
.thmodes{display:flex;gap:6px;margin-bottom:12px}
.thmodes .tchip{flex:1;text-align:center}
.thlab{font-size:11px;color:var(--muted);margin:0 0 8px;text-transform:uppercase;letter-spacing:.6px;font-weight:600}
.thsws{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:11px}
.thsw{width:30px;height:30px;border-radius:50%;border:2px solid rgba(255,255,255,.2);cursor:pointer;padding:0}
.thsw.on{outline:2px solid #8ab4ff;outline-offset:2px}
.thcustom{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted)}
.thcustom input[type=color]{width:40px;height:30px;border:1px solid var(--line2);border-radius:7px;background:transparent;padding:2px;cursor:pointer}
.thhex{font-family:var(--mono);font-size:11.5px;margin-left:auto}
.thdim{opacity:.4;pointer-events:none}
.thct{display:flex;justify-content:space-between;align-items:center;font-size:11.5px;color:var(--muted);margin:8px 0 0;padding-top:8px;border-top:1px dashed var(--line)}
.thct b{font-family:var(--mono);font-size:11.5px}
.engrow{display:flex;gap:6px;flex-wrap:wrap}
.cbwarn{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;font-size:11px;color:#E6C35C;margin-top:9px;line-height:1.6}
.cbwarn .cbm{color:var(--muted)}
.cbsafe{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;font-size:11px;color:#57C980;margin-top:9px;line-height:1.6}
html.light .cbsafe{color:#1E9E52}
.cbpair{display:inline-flex;gap:2px;vertical-align:middle}
.cbpair i{width:13px;height:13px;border-radius:3px;display:inline-block;border:1px solid rgba(255,255,255,.25)}
.sc-swrow{display:flex;gap:8px;justify-content:center;margin:0 auto 16px}
.sc-swrow span{width:52px;height:52px;border-radius:12px;border:1px solid rgba(255,255,255,.2)}
.sc-pair{max-width:340px;margin:0 auto 16px;border-radius:12px;border:1px solid var(--line2);padding:18px;font-weight:700;font-size:16px}
.streakline{text-align:center;color:var(--muted);font-size:13.5px;margin:0 0 14px}
.streakline b{color:var(--txt)}
.statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;max-width:560px;margin:0 auto 18px}
.statcard{background:linear-gradient(180deg,var(--surface),var(--surface2));border:1px solid var(--line);border-radius:12px;padding:14px;text-align:center}
.statcard .n{font-family:var(--disp);font-size:26px;font-weight:700}
.statcard .l{font-size:11.5px;color:var(--muted);margin-top:3px}
.boxbars{max-width:560px;margin:0 auto;text-align:left}
.boxbar{display:flex;align-items:center;gap:10px;margin-bottom:8px;font-size:12.5px;color:var(--muted)}
.boxbar .bl{width:64px;flex-shrink:0}
.boxbar .bt{flex:1;height:16px;background:var(--surface2);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.boxbar .bf{height:100%;background:linear-gradient(90deg,#8ab4ff,#a9c7ff)}
.boxbar .bn{width:34px;text-align:right;font-family:var(--mono)}
.thct.ok b{color:#4CC38A}.thct.mid b{color:#E6C35C}.thct.ko b{color:#F07A7A}
@media(max-width:560px){
 .themepop{right:auto;left:50%;transform:translateX(-50%)}
}
/* modo claro: acentos con contraste suficiente sobre fondos claros */
html.light .tab.on{border-color:#2b6cd9;color:#2b6cd9;background:rgba(43,108,217,.09)}
html.light .tchip.on{border-color:#2b6cd9;color:#2b6cd9;background:rgba(43,108,217,.08)}
html.light .modelbar .mt button.on{background:rgba(43,108,217,.12);color:#2b6cd9}
html.light .thsw{border-color:rgba(0,0,0,.15)}
html.light .pvOverlay{background:rgba(15,23,42,.4)}
html.light .toolbar input:focus{border-color:#2b6cd9}
html.light .tab.on,html.light .tchip.on{font-weight:700}
.kicker{font-family:var(--mono);font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--faint)}
h1{font-family:var(--disp);font-weight:700;font-size:clamp(24px,4vw,34px);letter-spacing:-.02em;margin:6px 0 4px}
.sub{color:var(--muted);font-size:14px;max-width:64ch;margin:0 auto}
.tabs{display:flex;gap:6px;justify-content:center;margin:6px 0 4px;flex-wrap:wrap}
.tab{background:var(--surface);border:1px solid var(--line2);color:var(--muted);border-radius:10px;padding:9px 16px;font-size:14px;font-weight:600;font-family:var(--disp);transition:.15s}
.tab:hover{color:var(--txt)}
.tab.on{border-color:#8ab4ff;color:#cfe0ff;background:rgba(138,180,255,.12)}
.modelbar{display:flex;justify-content:center;gap:10px;align-items:center;flex-wrap:nowrap;margin:16px 0 2px}
#modelCap{white-space:nowrap}
@media(max-width:560px){.modelbar{gap:8px}#modelCap{font-size:11px;letter-spacing:.2px}}
@media(max-width:380px){#modelCap{font-size:10px}}
.modelbar .mt{display:flex;gap:2px;background:var(--surface);border:1px solid var(--line2);border-radius:10px;padding:3px}
.modelbar .mt button{background:none;border:none;color:var(--faint);font-family:var(--disp);font-weight:600;font-size:13px;padding:7px 15px;border-radius:8px;transition:.14s}
.modelbar .mt button.on{background:rgba(138,180,255,.16);color:#cfe0ff}
.modelbar .cap{font-family:var(--mono);font-size:11px;color:var(--faint)}
.toolbar{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:12px 0 6px}
.toolbar input{background:var(--surface);border:1px solid var(--line2);border-radius:10px;color:var(--txt);font-family:var(--body);font-size:14px;padding:10px 14px;outline:none;width:min(320px,80vw)}
.toolbar input:focus{border-color:#8ab4ff}
.tempfilter{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-bottom:10px;align-items:center}
.flabel{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);margin-right:4px}
.tchip{border:1px solid var(--line2);background:transparent;color:var(--muted);border-radius:99px;padding:7px 13px;font-size:12.5px;font-weight:500;transition:.14s}
.tchip:hover{color:var(--txt)}
.tchip.on{border-color:#8ab4ff;color:#cfe0ff;background:rgba(138,180,255,.1)}
.stage{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,370px);gap:22px;align-items:start}
@media(max-width:820px){.stage{grid-template-columns:1fr}}
.wheelbox{position:relative;min-width:0}
svg.wheel{display:block;width:100%;height:auto;overflow:visible}
.seg{cursor:pointer;stroke:var(--bg);stroke-width:1;transition:opacity .15s,filter .15s}
.seg:hover{filter:brightness(1.1)}
.seg.dim{opacity:.13}
.seg.sel{stroke:#fff;stroke-width:2.6}
.seglab{font-family:var(--disp);font-weight:600;fill:var(--txt);pointer-events:none;transition:opacity .15s}
.seglab.dim{opacity:.22}
.segrole{pointer-events:none;transition:opacity .15s}
.segrole.primary{fill:var(--txt);stroke:var(--bg);stroke-width:1.5}
.segrole.secondary{fill:none;stroke:var(--txt);stroke-width:2}
.segrole.tertiary{fill:var(--txt);opacity:.4}
.segrole.dim{opacity:.18}
.rolekey{display:flex;gap:14px;flex-wrap:wrap;align-items:center;justify-content:center;margin:8px 0 0;font-size:11.5px;color:var(--faint)}
.rolekey span{display:inline-flex;align-items:center;gap:6px}
.rolekey i{display:inline-block;width:10px;height:10px;border-radius:50%;flex:0 0 auto}
.rolekey i.primary{background:var(--txt)}
.rolekey i.secondary{border:2px solid var(--txt)}
.rolekey i.tertiary{background:var(--txt);opacity:.4;width:5px;height:5px}
#harmLines{pointer-events:none}
.wheel-legend{text-align:center;font-family:var(--mono);font-size:11px;color:var(--faint);margin-top:10px;line-height:1.6}
.wheel-legend b{color:var(--muted)}
.rgbnote{margin-top:12px;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.rgbnote summary{cursor:pointer;font-family:var(--disp);font-weight:600;font-size:14px;color:var(--txt);list-style:none}
.rgbnote summary::-webkit-details-marker{display:none}
.rgbnote summary::before{content:'▸ ';color:#8ab4ff}
.rgbnote[open] summary::before{content:'▾ '}
.palextras{margin-top:26px;border-top:1px solid var(--line2);padding-top:6px}
.pex{margin:2px 0}
.pex>summary{cursor:pointer;font-family:var(--disp);font-weight:600;font-size:13px;color:var(--muted);list-style:none;padding:8px 2px}
.pex>summary::-webkit-details-marker{display:none}
.pex>summary::before{content:'▸ ';color:#8ab4ff}
.pex[open]>summary::before{content:'▾ '}
.pex.pexbig>summary{font-size:16px;font-weight:700;color:var(--txt);padding-top:10px}
.pexbody{padding:2px 2px 12px}
.appfoot{margin-top:30px;border-top:1px solid var(--line2);padding-top:12px}
.verline{font-size:12px;color:var(--muted);margin-bottom:6px;font-family:var(--mono)}
.vermiss{color:#E0472A;font-weight:600}
.diagrow{display:flex;justify-content:space-between;gap:14px;font-size:12px;padding:4px 0;border-bottom:1px solid var(--line)}
.diagrow>span:first-child{color:var(--muted)}
.diagval{color:var(--txt);font-family:var(--mono);text-align:right;word-break:break-word;max-width:65%}
.vlrow{font-size:12px;color:var(--muted);padding:4px 0;line-height:1.45}
.vlrow b{color:var(--txt);font-family:var(--mono);margin-right:7px}
.rgbnote .body{font-size:13px;color:var(--muted);line-height:1.55;margin-top:10px}
.rgbnote .body b{color:var(--txt)}
.rgbnote .body code{font-family:var(--mono);font-size:12px;color:#cfe0ff;background:rgba(138,180,255,.1);padding:1px 5px;border-radius:5px}
html.light .rgbnote .body code{color:#164A9E;background:rgba(28,100,212,.08)}
.panel{background:linear-gradient(180deg,var(--surface),var(--surface2));border:1px solid var(--line);border-radius:16px;padding:20px;position:sticky;top:16px}
.pl-empty{color:var(--faint);text-align:center;padding:40px 10px;font-size:14px}
.crumb{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:10px}
.catbadge{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;padding:3px 9px;border-radius:99px;font-weight:600}

.pen{color:var(--muted);font-size:15px;font-style:italic;margin-top:2px}
.palt{color:var(--faint);font-size:12.5px;font-family:var(--mono);margin-top:4px}

.swatch{height:74px;border-radius:12px;margin:14px 0 6px;border:1px solid var(--line2);position:relative}
.swatch .tag{position:absolute;left:10px;bottom:8px;font-family:var(--mono);font-size:11px;padding:2px 8px;border-radius:99px;background:rgba(0,0,0,.35);color:#fff}
.blk{margin-top:18px}
.blk h4{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);margin:0 0 9px}
.scalegroup{margin-bottom:9px}

.tintscale{display:flex;gap:5px}
.tintscale button{flex:1;height:28px;border-radius:7px;border:2px solid transparent;cursor:pointer;transition:.12s;padding:0}
.tintscale button.here{border-color:#fff}
.codes{display:flex;flex-direction:column;gap:7px}
.coderow{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--bg);border:1px solid var(--line2);border-radius:10px;padding:9px 12px;font-family:var(--mono);font-size:13px;transition:.14s;width:100%;text-align:left;color:var(--txt)}
.coderow:hover{border-color:#8ab4ff}
.coderow .lbl{color:var(--faint);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase}

.thermo{margin-top:4px}
.thermo .tscale{position:relative;height:14px;border-radius:99px;background:linear-gradient(90deg,#5AA9E6,#86C7D8,#C7CBB8,#EBB65B,#E8843D,#E0472A)}
.thermo .tmark{position:absolute;top:-4px;width:22px;height:22px;border-radius:50%;border:3px solid var(--bg);box-shadow:0 0 0 1px rgba(255,255,255,.3);transform:translateX(-50%)}

.assoc{display:flex;gap:7px;flex-wrap:wrap}
.atag{border:1px solid var(--line2);background:transparent;color:var(--muted);border-radius:99px;padding:5px 11px;font-size:12.5px}
.note{font-size:13px;color:var(--muted);line-height:1.5;background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:11px 13px}
.note b{color:var(--txt)}

:focus-visible{outline:2px solid #8ab4ff;outline-offset:2px}

/* v56: las reglas base con outline:none (0,1,1) ganaban al anillo global (0,1,0)
   incluso con el foco puesto: reponerlo con la especificidad necesaria */
.toolbar input:focus-visible,.mine input:focus-visible,.palfind input:focus-visible,.palfind select:focus-visible{outline:2px solid #8ab4ff;outline-offset:2px}
html.light .toolbar input:focus-visible,html.light .mine input:focus-visible,html.light .palfind input:focus-visible,html.light .palfind select:focus-visible{outline-color:#2b6cd9}
/* la rueda conserva su sistema original: outline:none + la clase .kbf que el JS
   pone al usarla con teclado (3px solid) — el audit inicial no la habia visto */

svg.wheel.kbf{outline:3px solid #8ab4ff;outline-offset:4px;border-radius:50%}
html.light svg.wheel.kbf{outline-color:#2b6cd9}

/* ============ HORIZONTAL BAJO (v55) ============
   Móvil girado (~390px de alto): el cromo vertical (6 filas apiladas, 284px)
   dejaba la rueda fuera de pantalla. Aquí el cromo se reorganiza en rejilla de
   3 filas (título+modelos / pestañas / buscador+filtros), las 7 vistas comparten
   el área 'vw' (solo una es visible; .hidden es display:none), la rueda se
   dimensiona por ALTURA y el panel scrollea a su lado. Este bloque va al final
   del CSS a propósito: a igualdad de especificidad gana el último declarado y
   pisa el colapso a 1 columna de @media(max-width:820px). En alto>520 no existe. */
@media(orientation:landscape) and (max-height:520px){
 .wrap{display:grid;grid-template-areas:"hd hd mb" "tb tb tb" "se tf cf" "vw vw vw";
  grid-template-columns:auto minmax(0,1fr) auto;column-gap:12px;align-items:center;padding-top:8px}
 header{grid-area:hd;margin:0;text-align:left;display:flex;align-items:center;gap:10px}
 .kicker,.sub{display:none} /* texto de bienvenida: prescindible sin altura */
 h1{font-size:17px;margin:0;white-space:nowrap}
 .topctrls{position:static;margin:0}
 #modelBar{grid-area:mb;margin:0;justify-content:flex-end;min-width:0}
 #modelCap{display:none} /* la leyenda «Modelo:» no cabe en 667px y no aporta */
 /* las 7 pestañas miden 692px de min-content y forzaban la rejilla entera a 709
    en un viewport de 667: una línea con scroll lateral (y min-width:0 para que
    la rejilla pueda encoger) */
 #tabs{grid-area:tb;margin:4px 0;min-width:0;overflow-x:auto;flex-wrap:nowrap;justify-content:flex-start;scrollbar-width:none}
 #tabs::-webkit-scrollbar{display:none}
 #tabs .tab{white-space:nowrap;flex:0 0 auto}
 #wheelTools{grid-area:se;margin:0}
 .toolbar #search{padding:6px 12px;font-size:16px;min-width:150px}
 #tempFilter{grid-area:tf}
 #catFilter{grid-area:cf}
 .tempfilter{margin:0;overflow-x:auto;flex-wrap:nowrap;justify-content:flex-start;scrollbar-width:none;min-width:0}
 .tempfilter::-webkit-scrollbar{display:none}
 /* sliders de filtro: de bloque vertical (64px) a línea; chips sin subtítulo */
 .tempfilter .tempslider{display:flex;align-items:center;gap:6px;flex:0 0 auto}
 .tempfilter .tchip small{display:none}
 .tempfilter .tchip{white-space:nowrap}
 #harmView,#palView,#theoryView,#studyView,#toolsView,#gridView,#wheelView{grid-area:vw;min-width:0}
 .stage{grid-template-columns:minmax(0,1fr) minmax(0,330px);gap:14px;margin-top:6px}
 /* por ANCHO con tope derivado de la altura: min(columna, altura_disponible*proporcion).
    Dimensionar por altura desbordaba la columna en viewports estrechos (667px:
    313px naturales > 291px de columna) y el SVG pisaba al panel. */
 #wheelHost svg.wheel{width:min(100%,calc((100dvh - 148px)*1.381));height:auto;max-width:100%;max-height:none;display:block;margin:0 auto}
 /* el tope descuenta la posicion NATURAL del panel (~140px de cromo), no el
    sticky: sin scroll el panel nace bajo el cromo y con -120 desbordaba */
 .panel{position:sticky;top:6px;max-height:calc(100dvh - 150px);overflow:auto;padding:14px}
 /* Armonías: misma receta (su rueda es cuadrada, 560×560) */
 /* chips de esquema: de 155px (varias filas) a una linea con scroll lateral */
 .harm-schemes{flex-wrap:nowrap;overflow-x:auto;justify-content:flex-start;scrollbar-width:none;min-width:0;margin-bottom:6px}
 .harm-schemes::-webkit-scrollbar{display:none}
 .harm-schemes .tchip{white-space:nowrap;flex:0 0 auto}
 /* la rueda es cuadrada (560x560): mismo patron ancho-con-tope; -100 = cromo
    + chips en una linea + leyenda */
 #harmView svg.wheel{width:min(100%,calc(100dvh - 200px));height:auto;max-width:100%;display:block;margin:0 auto}
 .panelcol{position:sticky;top:6px;max-height:calc(100dvh - 150px);overflow:auto}
 /* quiz de rueda en Estudiar: que la rueda entre sin scroll */
 .qwsvg{width:auto;height:min(300px,calc(100dvh - 200px));margin:6px auto 0}
 /* la barra de actualización no debe tapar media pantalla */
 .updbar{bottom:calc(6px + env(safe-area-inset-bottom))}
}

<script>
const $=s=>document.querySelector(s);
function esc(s){return (s||'').replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c];});}
function js(s){return "'"+String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'")+"'";}
function noAcc(s){return (s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}

/* ============ conversiones ============ */
function rgbOf(hex){var n=parseInt(hex.slice(1),16);return{r:n>>16,g:(n>>8)&255,b:n&255};}
function toHex(x){return x.toString(16).padStart(2,'0');}
function mixWhite(hex,amt){var c=rgbOf(hex);return '#'+toHex(Math.round(c.r+(255-c.r)*amt))+toHex(Math.round(c.g+(255-c.g)*amt))+toHex(Math.round(c.b+(255-c.b)*amt));}
function mixBlack(hex,amt){var c=rgbOf(hex);return '#'+toHex(Math.round(c.r*(1-amt)))+toHex(Math.round(c.g*(1-amt)))+toHex(Math.round(c.b*(1-amt)));}
function mixGray(hex,amt){var c=rgbOf(hex);return '#'+toHex(Math.round(c.r+(128-c.r)*amt))+toHex(Math.round(c.g+(128-c.g)*amt))+toHex(Math.round(c.b+(128-c.b)*amt));}
function hslOf(hex){var c=rgbOf(hex),r=c.r/255,g=c.g/255,b=c.b/255,mx=Math.max(r,g,b),mn=Math.min(r,g,b),h,s,l=(mx+mn)/2;
 if(mx===mn){h=s=0;}else{var d=mx-mn;s=l>0.5?d/(2-mx-mn):d/(mx+mn);
  if(mx===r)h=(g-b)/d+(g<b?6:0);else if(mx===g)h=(b-r)/d+2;else h=(r-g)/d+4;h/=6;}
 return{h:Math.round(h*360),s:Math.round(s*100),l:Math.round(l*100)};}
function hslToHex(h,s,l){s/=100;l/=100;var k=function(n){return (n+h/30)%12;},a=s*Math.min(l,1-l),
 f=function(n){var x=l-a*Math.max(-1,Math.min(k(n)-3,Math.min(9-k(n),1)));return Math.round(255*x);};
 return '#'+toHex(f(0))+toHex(f(8))+toHex(f(4));}
function rgbStr(hex){var c=rgbOf(hex);return 'rgb('+c.r+', '+c.g+', '+c.b+')';}
function hslStr(hex){var c=hslOf(hex);return 'hsl('+c.h+', '+c.s+'%, '+c.l+'%)';}
/* Elige el color de texto sobre un fondo arbitrario maximizando el ratio WCAG real,
   en vez del viejo umbral YIQ. Escoger el mejor entre negro y blanco garantiza
   siempre >= 4.58 (el minimo se da en Y = 0.1791), asi que nunca baja de AA. */
/* Banda del HEX sobre una muestra: velo y texto adaptados al color de debajo. */

}

/* ---- Clasificación e integración de los colores CSS ---- */
function normEn(s){return (s||'').toLowerCase().replace(/[^a-z]/g,'');}
function mergeCssInto(arr){
 var seenHex={},seenEn={},seenEs={};
 arr.forEach(function(h){(h.named||[]).forEach(function(n){seenHex[n.hex.toUpperCase()]=1;seenEn[normEn(n.en)]=1;seenEs[noAcc(n.es)]=1;});});
 var famHue=arr.map(function(h){return {h:h,hue:hslOf(h.hex).h};});
 CSSX.forEach(function(c){
  if(c.g)return;
  var HX=c.hex.toUpperCase(),ek=normEn(c.en),sk=noAcc(c.es);
  if(seenHex[HX]||seenEn[ek]||seenEs[sk])return;
  var hue=hslOf(c.hex).h,best=null,bd=999;
  famHue.forEach(function(f){var d=Math.abs(f.hue-hue);d=Math.min(d,360-d);if(d<bd){bd=d;best=f.h;}});
  best.named=best.named||[];
  best.named.push({es:c.es,en:c.en,hex:c.hex});
  seenHex[HX]=1;seenEn[ek]=1;seenEs[sk]=1;
 });
}
function buildNeutrals(){
 var seen={};
 [HUES_RYB,HUES_RGB,HUES_CMY].forEach(function(arr){arr.forEach(function(h){(h.named||[]).forEach(function(n){seen[n.hex.toUpperCase()]=1;});});});
 CSSX.forEach(function(c){
  if(!c.g)return;
  if(seen[c.hex.toUpperCase()])return;
  var fam=NById['n_'+c.g];
  fam.named.push({es:c.es,en:c.en,hex:c.hex});
 });
}
mergeCssInto(HUES_RYB);mergeCssInto(HUES_RGB);mergeCssInto(HUES_CMY);buildNeutrals();

 legendCmy:['Rueda de <b>tinta (CMY, sustractiva)</b>: primarios cian-magenta-amarillo, secundarios azul-rojo-verde. Es la rueda de la impresión en papel (la K de CMYK es la tinta negra). De saturada (fuera) a clara (dentro).','<b>Ink wheel (CMY, subtractive)</b>: primaries cyan-magenta-yellow, secondaries blue-red-green. It is the wheel of printing on paper (the K in CMYK is the black ink). From saturated (outer) to light (inner).'],
 rgbTitle:['¿En qué se diferencian las ruedas RGB, RYB y CMY?','How do the RGB, RYB and CMY wheels differ?'],
 rgbBody:['Hay tres ruedas según el material: <b>RYB</b> es la del <b>pigmento</b> (pintura): primarios rojo, amarillo y azul; es la base de las armonías. <b>RGB</b> es la de la <b>luz</b> (pantallas y VFX, aditiva): primarios <code>rojo, verde y azul</code>. <b>CMY</b> es la de la <b>tinta</b> (impresión, sustractiva): primarios <code>cian, magenta y amarillo</code>. Mezclar luz aclara; mezclar pigmento o tinta oscurece. Usa el interruptor <b>RGB / RYB / CMY</b> de arriba para cambiar de rueda. Más en la pestaña <b>Teoría</b>.','There are three wheels depending on the material: <b>RYB</b> is the <b>pigment</b> wheel (paint): primaries red, yellow, blue; the base of harmony. <b>RGB</b> is the <b>light</b> wheel (screens and VFX, additive): primaries <code>red, green, blue</code>. <b>CMY</b> is the <b>ink</b> wheel (print, subtractive): primaries <code>cyan, magenta, yellow</code>. Mixing light lightens; mixing pigment or ink darkens. Use the <b>RGB / RYB / CMY</b> switch above to change wheel. More in the <b>Theory</b> tab.'],
 madeOf:['Se forma de','Made of'],
 primaryBase:['Color primario: no se obtiene mezclando otros.','Primary colour: it can\u2019t be made by mixing others.'],

 okRampH:['Rampa perceptual (OKLCH)','Perceptual ramp (OKLCH)'],
 okGloss:['<b>OKLCH</b> = <b>OK</b>lab en coordenadas polares: <b>L</b>uminosidad perceptual, <b>C</b>roma (viveza) y <b>H</b> de <i>hue</i>, el matiz. Oklab est\u00e1 construido para que la misma distancia num\u00e9rica se vea como la misma diferencia de color.','<b>OKLCH</b> = <b>OK</b>lab in polar coordinates: perceptual <b>L</b>ightness, <b>C</b>hroma (vividness) and <b>H</b>ue. Oklab is built so that equal numeric distances look like equal colour differences.'],
 okRampNote:['<b>OKLCH</b> = <b>OK</b>lab en coordenadas polares: <b>L</b>uminosidad perceptual, <b>C</b>roma (viveza) y <b>H</b> de <i>hue</i>, el matiz. Oklab es un espacio dise\u00f1ado para que la misma distancia num\u00e9rica se vea como la misma diferencia de color; por eso, al repartir la L en pasos iguales, la rampa se percibe uniforme. Aqu\u00ed solo cambia la L: el matiz y el croma son los del color base, y el croma se reduce cuando el color ya no cabe en sRGB.','<b>OKLCH</b> = <b>OK</b>lab in polar coordinates: perceptual <b>L</b>ightness, <b>C</b>hroma (vividness) and <b>H</b>ue. Oklab is a space built so that equal numeric distances look like equal colour differences; that is why evenly spaced L values give a ramp that <i>looks</i> even. Only L changes here: hue and chroma come from the base colour, and chroma is reduced when the colour no longer fits in sRGB.'],

var nb=RINGS.length,bandW=(RO-RH)/nb;
var SCALE5=[0,0.2,0.4,0.6,0.78];
function pol(cx,cy,r,a){return [cx+r*Math.cos(a),cy+r*Math.sin(a)];}
function arcPath(r0,r1,a0,a1){
 var p0=pol(CX,CY,r0,a0),p1=pol(CX,CY,r1,a0),p2=pol(CX,CY,r1,a1),p3=pol(CX,CY,r0,a1);
 var large=(a1-a0)>Math.PI?1:0;
 return 'M'+p0[0]+' '+p0[1]+' L'+p1[0]+' '+p1[1]+' A'+r1+' '+r1+' 0 '+large+' 1 '+p2[0]+' '+p2[1]+' L'+p3[0]+' '+p3[1]+' A'+r0+' '+r0+' 0 '+large+' 0 '+p0[0]+' '+p0[1]+' Z';
}

/* Coloca cada marcador de rol MAS ALLA de la etiqueta (entre la palabra y el
   borde), midiendo el texto real con getBBox(); antes iba entre la rueda y la
   palabra y se solapaba con los nombres largos. Fallback estimado para
   entornos sin getBBox (jsdom) y re-medicion en window.load por si la fuente
   web llega tarde y cambia los anchos. */
function placeRoles(){
 var svg=document.querySelector('#wheelHost svg');if(!svg)return;
 HUES.forEach(function(h){
  var lab=svg.querySelector('.seglab[data-id="'+h.id+'"]');
  var role=svg.querySelector('.segrole[data-id="'+h.id+'"]');
  if(!lab||!role)return;
  var cos=Math.cos(h.ang),sin=Math.sin(h.ang),x,y,bb=null;
  try{if(typeof lab.getBBox==='function')bb=lab.getBBox();}catch(e){}
  if(bb&&bb.width){
   if(cos>0.28){x=bb.x+bb.width+9;y=bb.y+bb.height/2;}
   else if(cos<-0.28){x=bb.x-9;y=bb.y+bb.height/2;}
   else{x=bb.x+bb.width/2;y=(sin<0)?(bb.y-8):(bb.y+bb.height+8);}
  }else{
   var est=(lab.textContent||'').length*7.6+12,lr=RO+16;
   var bx=CX+lr*cos,by=CY+lr*sin;
   if(cos>0.28){x=bx+est;y=by;}
   else if(cos<-0.28){x=bx-est;y=by;}
   else{x=bx;y=by+((sin<0)?-14:14);}
  }
  role.setAttribute('cx',x);role.setAttribute('cy',y);
 });
}
window.addEventListener('load',function(){placeRoles();});

/* Escalera monocromatica en OKLCH (v47): se conservan matiz y croma del color base
   y se reparte la claridad de forma uniforme. oklchToHex reduce el croma por busqueda
   binaria si el peldano se sale de gama, que es justo como se estrecha el gamut hacia
   el blanco y el negro. Antes se hacia en HSL, donde la 'l' no es claridad percibida:

}

function buildHarmWheel(){
 var sz=560,c=sz/2,r0=92,r1=250;
 var svg=document.createElementNS(NS,'svg');svg.setAttribute('viewBox','0 0 '+sz+' '+sz);svg.setAttribute('class','wheel');svg.style.maxWidth='520px';svg.style.margin='0 auto';
 var lines=document.createElementNS(NS,'g');lines.setAttribute('id','harmLines');
 var cols=harmColors(),sel={};cols.forEach(function(cc){if(cc.id)sel[cc.id]=1;});
 var s=SCHEMES.find(function(x){return x.id===harmScheme;});
 HUES.forEach(function(h){
  var a0=h.ang-STEP/2,a1=h.ang+STEP/2;
  var p0=[c+r0*Math.cos(a0),c+r0*Math.sin(a0)],p1=[c+r1*Math.cos(a0),c+r1*Math.sin(a0)],p2=[c+r1*Math.cos(a1),c+r1*Math.sin(a1)],p3=[c+r0*Math.cos(a1),c+r0*Math.sin(a1)];
  var d='M'+p0[0]+' '+p0[1]+' L'+p1[0]+' '+p1[1]+' A'+r1+' '+r1+' 0 0 1 '+p2[0]+' '+p2[1]+' L'+p3[0]+' '+p3[1]+' A'+r0+' '+r0+' 0 0 0 '+p0[0]+' '+p0[1]+' Z';
  var path=document.createElementNS(NS,'path');path.setAttribute('d',d);path.setAttribute('fill',h.hex);
  path.setAttribute('class','seg'+(s.mono?(h.id===harmBase?' sel':' dim'):(sel[h.id]?' sel':' dim')));
  path.dataset.id=h.id;svg.appendChild(path);
 });
 if(!s.mono){cols.forEach(function(cc){var h=HById[cc.id];if(!h)return;var p=[c+r0*Math.cos(h.ang),c+r0*Math.sin(h.ang)];
  var ln=document.createElementNS(NS,'line');ln.setAttribute('x1',c);ln.setAttribute('y1',c);ln.setAttribute('x2',p[0]);ln.setAttribute('y2',p[1]);
  ln.setAttribute('stroke',h.hex);ln.setAttribute('stroke-width','2.5');lines.appendChild(ln);});
  svg.appendChild(lines);
  var cd=document.createElementNS(NS,'circle');cd.setAttribute('cx',c);cd.setAttribute('cy',c);cd.setAttribute('r','5');cd.setAttribute('fill','#fff');svg.appendChild(cd);
 }
 svg.addEventListener('click',function(e){var seg=e.target.closest('.seg');if(seg){harmBase=seg.dataset.id;renderHarm();}});
 return svg;
}
var harmAnim=null;
window.harmToggleAnim=function(){
 if(harmAnim){clearInterval(harmAnim);harmAnim=null;renderHarm();return;}
 harmAnim=setInterval(function(){
  if(activeTab()!=='harm'){clearInterval(harmAnim);harmAnim=null;return;}
  var h=HById[harmBase]||HUES[0];
  harmBase=HUES[(h.idx+1)%12].id;
  renderHarm();
 },1000);
 renderHarm();
};
function fhBlockHtml(){
 var schemes=fhSchemes(fhBase);window._fhSchemes=schemes;
 var rows=schemes.map(function(sch,i){
  var sw=sch.cols.map(function(c){return '<button class="ssw" style="background:'+c+'" title="'+c+'" onclick="copyCode(&#39;'+c+'&#39;)"></button>';}).join('');
  return '<div class="schemerow"><span class="lbl">'+T(sch.k)+'</span>'+sw+'<button class="mini" onclick="fhToBasket('+i+')">'+T('toBasket')+'</button></div>';
 }).join('');
 return '<div class="fhblock"><h4 class="fhtitle">'+T('fhInHarmH')+'</h4><p class="fhhint">'+T('fhInHarmHint')+'</p>'
  +'<div class="pickrow" style="margin-bottom:6px">'+pickInput('fh',fhBase)+'</div>'
  +'<div class="nearline">'+T('fhNear')+' '+esc(nearestName(fhBase))+'</div>'+rows+'</div>';
}
function renderHarm(){
 if(!harmBase||!HById[harmBase])harmBase=HUES[0].id;
 var host=$('#harmView');
 var schemeChips=SCHEMES.map(function(s){return '<button class="chip'+(s.id===harmScheme?' on':'')+'" onclick="setScheme(\''+s.id+'\')">'+P(s)+'<small>'+(LANG==='es'?s.subEs:s.subEn)+'</small></button>';}).join('');
 var s=SCHEMES.find(function(x){return x.id===harmScheme;});
 var cols=harmColors();
 var sw=cols.map(function(cc){return '<button class="hsw" onclick="copyCode(\''+cc.hex.toUpperCase()+'\')"><div class="col" style="background:'+cc.hex+'"></div><div class="meta"><b>'+esc(cc.name)+'</b>'+cc.hex.toUpperCase()+'</div></button>';}).join('');
 host.innerHTML='<p class="sub" style="margin:0 auto 16px">'+T('harmSub')+'</p>'
  +'<div class="stage"><div class="wheelbox"><div class="harm-schemes">'+schemeChips+'</div><div id="harmHost"></div>'
  +'<div class="wheel-legend legend-anim" style="margin-top:6px"><button class="mini animbtn" onclick="harmToggleAnim()">'+(harmAnim?T('haStop'):T('haPlay'))+'</button><span class="animbase">'+T('base')+': <b>'+esc(hueName(HById[harmBase]))+'</b></span></div></div>'
  +'<div class="panelcol"><div class="panel"><h4 style="font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);margin:0 0 9px">'+P(s)+'</h4>'
  +'<div class="harm-desc" id="harmDesc">'+(LANG==='es'?s.dEs:s.dEn)+'</div>'
  +'<div class="harm-out"><div class="harm-swatches">'+sw+'</div></div>'
  +(s.mono?'<p class="cbnote" style="margin:10px 0 0">'+T('harmOkNote')+'</p><p class="okhint">'+T('okGloss')+'</p>':'')+'</div>'
  +fhBlockHtml()+'</div></div>';
 $('#harmHost').appendChild(buildHarmWheel());
  fitHarmDesc();
}
function fitHarmDesc(){
 var el=document.getElementById('harmDesc');if(!el)return;
 var w=el.clientWidth;if(!w)return;
 var cs=getComputedStyle(el),probe=document.createElement('div');
 probe.style.cssText='position:absolute;left:-9999px;top:0;visibility:hidden;box-sizing:border-box';
 probe.style.width=w+'px';probe.style.padding=cs.padding;
 probe.style.borderTop='1px solid transparent';probe.style.borderBottom='1px solid transparent';
 probe.style.fontFamily=cs.fontFamily;probe.style.fontSize=cs.fontSize;probe.style.lineHeight=cs.lineHeight;probe.style.fontWeight=cs.fontWeight;
 document.body.appendChild(probe);
 var maxh=0;SCHEMES.forEach(function(sc){probe.innerHTML=(LANG==='es'?sc.dEs:sc.dEn);if(probe.offsetHeight>maxh)maxh=probe.offsetHeight;});
 document.body.removeChild(probe);
 if(maxh>0)el.style.height=maxh+'px';
}

function savePalPref(){try{window.storage.set(PALPREF_KEY,JSON.stringify({sort:palSort,cat:palFil,safe:palSafe}));}catch(e){}}
function loadPalPref(){return window.storage.get(PALPREF_KEY).then(function(r){
  if(!r||!r.value)return;var o=JSON.parse(r.value);
  if(o.sort&&PALSORTS.some(function(x){return x[0]===o.sort;}))palSort=o.sort;
  if(o.cat&&PALCATS.some(function(x){return x[0]===o.cat;}))palFil=o.cat;
  palSafe=!!o.safe;
 }).catch(function(){});}

window.setPalSafe=function(){
 palSafe=!palSafe;savePalPref();

};

  if(bi<0)break;

function pcCtLine(cols){
 var best=null,ok=0,total=0;
 for(var i=0;i<cols.length;i++)for(var j=i+1;j<cols.length;j++){
  total++;var r=contrastRatio(cols[i].hex,cols[j].hex);
  if(r>=4.5)ok++;
  if(!best||r>best.r)best={r:r,a:cols[i].hex,b:cols[j].hex};
 }
 if(!ok)return T('pcCtNone');
 return '\u267f '+ok+'/'+total+' '+T('pcCtPairs')+' \u00b7 '+T('pcCtBest')+': '+best.a+' '+T('pcCtOn')+' '+best.b+' ('+(Math.round(best.r*100)/100).toFixed(2)+':1)';
}
function pcMoodPick(cands,mood){
 var cs=cands.map(function(hx){var c=hsvOf(hx);return{hex:hx,h:c.h,s:c.s,v:c.v};});
 function score(c){
  switch(mood){
   case 'colorful':return c.s;
   case 'bright':return c.v*0.7+c.s*0.3;
   case 'muted':return (100-c.s)*0.7+Math.min(c.v,80)*0.3;
   case 'deep':return c.s*0.6+(100-c.v)*0.4;
   case 'dark':return (100-c.v);
   default:return 0;
  }
 }
 cs.sort(function(a,b){return score(b)-score(a);});
 /* en «Colorido» exigimos separación de color amplia; en el resto, solo evitar casi-duplicados
    para que mande la puntuación del ambiente */
 var picked=[],minD=mood==='colorful'?45:6;
 function dist(a,b){var x=rgbOf(a.hex),y=rgbOf(b.hex);return Math.sqrt((x.r-y.r)*(x.r-y.r)+(x.g-y.g)*(x.g-y.g)+(x.b-y.b)*(x.b-y.b));}
 cs.forEach(function(c){
  if(picked.length>=5)return;
  var far=picked.every(function(p){return dist(c,p)>=minD;});
  if(far)picked.push(c);
 });
 cs.forEach(function(c){if(picked.length<5&&picked.indexOf(c)<0)picked.push(c);});
 return picked.slice(0,5).map(function(c){return c.hex;});
}

function pcSync(){

  if(h){h.style.left=p.x+'%';h.style.top=p.y+'%';h.style.background=c.hex;h.classList.toggle('base',isB);}

   var tri=s.querySelector('.tri');
   if(isB&&!tri)s.insertAdjacentHTML('beforeend','<span class="tri"></span>');

  if(x)x.textContent=c.hex;
 });

function pcApplyPoint(i,h,s){
 if(PC.rule==='custom'){PC.custom[i].h=h;PC.custom[i].s=s;PC.sel=i;}
 else{var o=pcRule().d[i];PC.h=((h-o[0])%360+360)%360;PC.s=pcClamp(s/o[1],5,100);}
}
function pcBind(){
 var box=$('#pcBox');if(!box)return;
 var dragI=null;
 function pt(e){
  var r=box.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
  var dx=e.clientX-cx,dy=e.clientY-cy;
  var h=(Math.atan2(dy,dx)*180/Math.PI+90+360)%360;
  var s=pcClamp(Math.sqrt(dx*dx+dy*dy)/(r.width*0.45)*100,0,100);
  return{h:h,s:s};
 }
 box.addEventListener('pointerdown',function(e){
  var t=e.target.closest('.pch');
  dragI=t?+t.dataset.i:(PC.rule==='custom'?PC.sel:2);
  var p=pt(e);pcApplyPoint(dragI,p.h,p.s);
  if(PC.rule==='custom'&&t)PC.sel=+t.dataset.i;
  if(box.setPointerCapture)try{box.setPointerCapture(e.pointerId);}catch(err){}
  pcSync();
  e.preventDefault();
 });
 box.addEventListener('pointermove',function(e){
  if(dragI===null)return;
  var p=pt(e);pcApplyPoint(dragI,p.h,p.s);pcSync();
 });
 function up(){if(dragI===null)return;dragI=null;pcSync();}
 box.addEventListener('pointerup',up);box.addEventListener('pointercancel',up);
}

window.pcImageFile=function(file){
 if(!file)return;
 var img=new Image();
 img.onload=function(){
  try{
   var cv=document.createElement('canvas'),W=80,H=Math.max(1,Math.round(W*img.height/img.width));
   cv.width=W;cv.height=H;var ctx=cv.getContext('2d');
   if(!ctx){toast(T('imgFail'));return;}
   ctx.drawImage(img,0,0,W,H);
   var data=ctx.getImageData(0,0,W,H).data,px=[];
   for(var i=0;i<data.length;i+=4){if(data[i+3]<125)continue;px.push([data[i],data[i+1],data[i+2]]);}
   var cols;
   if(PC.mood==='auto')cols=quantize(px,5).map(rgbToHex);
   else{var cands=quantize(px,12).map(rgbToHex);cols=pcMoodPick(cands,PC.mood);}
   while(cols.length&&cols.length<5)cols.push(mixWhite(cols[cols.length-1],0.3));
   if(!cols.length){toast(T('imgFail'));return;}
   PC.custom=cols.map(function(h){var c=hsvOf(h);return{h:c.h,s:c.s,v:c.v};});
   PC.rule='custom';PC.sel=2;renderPal();
  }catch(e){toast(T('imgFail'));}
 };
 img.onerror=function(){toast(T('imgFail'));};
 var rd=new FileReader();rd.onload=function(){img.src=rd.result;};rd.onerror=function(){toast(T('imgFail'));};rd.readAsDataURL(file);
};

  f:['Es como cocinar: hay recetas de la abuela (RYB, para mezclar pintura) y recetas para el microondas moderno (RGB, para pantallas). Las dos sirven; solo cambia con qué cocinas.','It\u2019s like cooking: there are grandma\u2019s recipes (RYB, for mixing paint) and modern-microwave recipes (RGB, for screens). Both work; only the tool changes.']},
 {t:['Las tres ruedas: RGB, CMY y RYB','The three wheels: RGB, CMY and RYB'],
  b:['Una rueda de color organiza los colores en círculo mostrando la relación entre primarios, secundarios y terciarios — y hay tres ruedas importantes según con qué trabajes. ① La rueda <b>RGB</b> (rojo, verde, azul) representa las tres fuentes de <b>luz</b> que forman los colores en una pantalla de TV u ordenador. Sus primarios son <b>rojo, verde y azul</b>, y los secundarios salen de sumar luces: rojo + verde = <b>amarillo</b>, verde + azul = <b>cian</b>, azul + rojo = <b>magenta</b>. Es tu rueda de trabajo en VFX. ② La rueda <b>CMY(K)</b> (cian, magenta, amarillo) representa las <b>tintas</b> con las que se imprime sobre papel. Sus primarios son <b>cian, magenta y amarillo</b>, y los secundarios salen de mezclar tintas: cian + magenta = <b>azul</b>, magenta + amarillo = <b>rojo</b>, amarillo + cian = <b>verde</b>. La K es la tinta negra (key) que se añade en imprenta. Fíjate en que es la inversa de RGB: los primarios de una son los secundarios de la otra. ③ La rueda <b>RYB</b> (rojo, amarillo, azul) es la que usan <b>pintores, artistas y diseñadores</b> para mezclar pigmento. Primarios: <b>rojo, amarillo y azul</b>; secundarios: rojo + amarillo = <b>naranja</b>, amarillo + azul = <b>verde</b>, azul + rojo = <b>violeta</b>; y seis terciarios de mezclar cada primario con su secundario vecino. RYB es la mejor rueda para identificar qué colores combinan bien: por eso las armonías de esta app (y de casi todas las herramientas de esquemas de color) se apoyan en ella.','A colour wheel organizes colours around a circle showing the relationship between primary, secondary and tertiary colours — and there are three important wheels depending on what you work with. ① The <b>RGB</b> wheel (red, green, blue) represents the three <b>light</b> sources that produce colours on a TV or computer screen. Its primaries are <b>red, green and blue</b>, and secondaries come from adding light: red + green = <b>yellow</b>, green + blue = <b>cyan</b>, blue + red = <b>magenta</b>. This is your working wheel in VFX. ② The <b>CMY(K)</b> wheel (cyan, magenta, yellow) represents the <b>inks</b> used to print on paper. Its primaries are <b>cyan, magenta and yellow</b>, and secondaries come from mixing inks: cyan + magenta = <b>blue</b>, magenta + yellow = <b>red</b>, yellow + cyan = <b>green</b>. The K is the black (key) ink added in printing. Notice it is the inverse of RGB: the primaries of one are the secondaries of the other. ③ The <b>RYB</b> wheel (red, yellow, blue) is the one <b>painters, artists and designers</b> use for blending pigment. Primaries: <b>red, yellow and blue</b>; secondaries: red + yellow = <b>orange</b>, yellow + blue = <b>green</b>, blue + red = <b>purple</b>; plus six tertiaries from mixing each primary with its neighbouring secondary. RYB is the best wheel to identify colours that go well together: that is why the harmonies in this app (and in most colour-scheme tools) rely on it.'],
  f:['Tres fábricas, tres recetas: la fábrica de pantallas mezcla focos de luz (RGB), la imprenta mezcla tintas (CMY) y el taller del pintor mezcla pigmentos (RYB). El mismo arcoíris, ordenado de tres maneras.','Three factories, three recipes: the screen factory mixes light beams (RGB), the print shop mixes inks (CMY) and the painter\u2019s workshop mixes pigments (RYB). The same rainbow, arranged three ways.']},
 {t:['Primarios, secundarios y terciarios','Primary, secondary, tertiary'],
  b:['Los <b>primarios</b> no se pueden crear mezclando otros: son la base (en RYB: rojo, amarillo, azul). Los <b>secundarios</b> salen de mezclar dos primarios. Los <b>terciarios</b>, de un primario con el secundario vecino (rojo-naranja, azul-violeta…). En la rueda RGB los primarios cambian a rojo, verde y azul: prueba el interruptor y verás que el amarillo pasa a ser secundario.','<b>Primaries</b> can\u2019t be mixed from others: they\u2019re the base (RYB: red, yellow, blue). <b>Secondaries</b> come from mixing two primaries. <b>Tertiaries</b> from a primary plus its neighbouring secondary (red-orange, blue-violet…). On the RGB wheel primaries change to red, green, blue: try the switch and yellow becomes a secondary.'],
  f:['Los primarios son las 3 piezas de Lego de partida. Juntando dos sale una pieza nueva (secundario), y juntando esa con otra sale una aún más específica (terciario).','Primaries are the 3 starting Lego bricks. Snap two together for a new brick (secondary); snap that with another for an even more specific one (tertiary).']},
 {t:['Tono, valor e intensidad','Hue, value and intensity'],
  b:['Todo color se describe con tres propiedades. El <b>tono (hue)</b> es el nombre del color. El <b>valor (value)</b> es cómo de claro u oscuro es. La <b>intensidad o saturación</b> es cómo de puro o vivo es frente a apagado. Cambiando estas tres tienes millones de colores a partir de doce.','Every colour has three properties. <b>Hue</b> is its name. <b>Value</b> is how light or dark it is. <b>Intensity/saturation</b> is how pure and vivid vs muted it is. Change these three and twelve colours become millions.'],
  f:['Piensa en un mando: un botón elige el color (tono), otro sube o baja la luz (valor) y otro lo hace más chillón o apagado (intensidad).','Think of a remote: one button picks the colour (hue), another turns light up/down (value), another makes it louder or duller (intensity).']},
 {t:['Tinte, tono y sombra','Tint, tone and shade'],
  b:['A partir de un color puro: si le añades <b>blanco</b> obtienes un <b>tinte</b> (más claro, como el rosa desde el rojo). Si le añades <b>gris</b> obtienes un <b>tono</b> (más apagado). Si le añades <b>negro</b> obtienes una <b>sombra</b> (más oscuro). En el panel de la Rueda tienes las tres escalas para cualquier familia.','From a pure colour: add <b>white</b> for a <b>tint</b> (lighter, like pink from red). Add <b>grey</b> for a <b>tone</b> (muted). Add <b>black</b> for a <b>shade</b> (darker). The Wheel panel gives you all three scales for any family.'],
  f:['El color puro es un chupito de refresco. Con agua (blanco) queda suave, con un poco de café (gris) queda turbio y con tinta (negro) queda oscuro. Mismo sabor, distinta fuerza.','The pure colour is a shot of soda. With water (white) it\u2019s soft, with a bit of coffee (grey) it\u2019s murky, with ink (black) it\u2019s dark. Same flavour, different strength.'],viz:tintToneShadeViz},
 {t:['Colores cálidos y fríos','Warm and cool colours'],
  b:['Los <b>cálidos</b> (rojos, naranjas, amarillos) parecen avanzar hacia ti y dan energía. Los <b>fríos</b> (verdes, azules, violetas) parecen alejarse y dan calma. Truco muy usado: fondo frío y protagonista cálido, para que la mirada vaya al sujeto. Es la base del "turquesa y naranja" del cine.','<b>Warm</b> colours (reds, oranges, yellows) seem to advance and feel energetic. <b>Cool</b> colours (greens, blues, violets) seem to recede and feel calm. Classic trick: cool background, warm subject, so the eye goes to the subject. It\u2019s the base of film\u2019s "teal and orange".'],
  f:['El fuego es cálido y parece cerca; el hielo es frío y parece lejos. Si pintas al héroe con colores de fuego sobre un fondo de hielo, destaca solo.','Fire is warm and looks near; ice is cool and looks far. Paint the hero in fire colours over an ice background and they stand out by themselves.'],viz:tempViz},
 {t:['Armonías: cómo combinar','Harmonies: how to combine'],
  b:['Según su posición en la rueda, los colores forman grupos con carácter propio: <b>análogos</b> (vecinos, calmados), <b>complementarios</b> (opuestos, máximo contraste), <b>tríada</b> (tres equidistantes, vivos), <b>complementario dividido</b> y <b>tétrada</b>. Los tienes todos, interactivos, en la pestaña <b>Armonías</b>.','By their position on the wheel, colours form groups with their own character: <b>analogous</b> (neighbours, calm), <b>complementary</b> (opposites, max contrast), <b>triadic</b> (three evenly spaced, lively), <b>split-complementary</b> and <b>tetradic</b>. They\u2019re all interactive in the <b>Harmonies</b> tab.'],
  f:['Es como juntar amigos en una foto: los que se parecen (vecinos) dan una foto tranquila; dos muy opuestos, una foto llamativa. La rueda te dice quién pega con quién.','Like grouping friends for a photo: similar ones (neighbours) give a calm shot; two opposites give a striking one. The wheel tells you who goes with whom.']},
 {t:['Contraste y contexto','Contrast and context'],
  b:['Un color <b>nunca se ve solo</b>: cambia según lo que tiene al lado. Un gris parece más cálido junto al azul y más frío junto al rojo. Por eso el <b>contraste</b> (de luz sobre todo) manda para que algo se lea bien. En VFX es clave: el mismo efecto luce distinto según el fondo.','A colour is <b>never seen alone</b>: it shifts with its surroundings. A grey looks warmer next to blue and cooler next to red. That\u2019s why <b>contrast</b> (of value above all) rules readability. In VFX it\u2019s key: the same effect reads differently depending on the background.'],
  f:['La misma camiseta gris parece distinta según la chaqueta que lleves encima. El color de al lado te "engaña" un poco.','The same grey shirt looks different depending on the jacket over it. The neighbouring colour "tricks" your eye a bit.']},
 {t:['Psicología del color','Colour psychology'],
  b:['Los colores no solo se ven: <b>influyen</b> en el comportamiento humano, en la percepción, en el atractivo de las cosas e incluso en el sabor que atribuimos a la comida. Cada color tiene percepciones muy repetidas entre culturas: el <b>rojo</b> es el que más atrae la mirada (energía, peligro, pasión); el <b>verde</b> es el más relajante para el ojo (naturaleza, seguridad, armonía); el <b>azul</b> es el más usado en oficinas (mar, calidad, cielo: estabilidad, sabiduría, verdad); el <b>amarillo</b> es "el color feliz" (sol, optimismo); el <b>negro</b> transmite autoridad y misterio; el <b>gris</b> es el color conservador (seguridad, fiabilidad); y el <b>blanco</b> es pureza (limpieza, inocencia). En VFX esto se usa a diario: un efecto rojo se lee como daño o peligro y uno verde como veneno o curación, antes de que el jugador procese nada más. Recuerda el apunte de la rueda: son convenciones culturales, no leyes.','Colours aren\\u2019t just seen: they <b>influence</b> human behaviour, perception, attractiveness and even how food tastes to us. Each colour carries widely repeated perceptions: <b>red</b> attracts the eye the most (energy, danger, passion); <b>green</b> is the most restful (nature, safety, harmony); <b>blue</b> is the most used office colour (sea, quality, sky: stability, wisdom, truth); <b>yellow</b> is "the happy colour" (sunshine, optimism); <b>black</b> conveys authority and mystery; <b>grey</b> is the conservative colour (security, reliability); and <b>white</b> is purity (cleanliness, innocence). VFX uses this daily: a red effect reads as damage or danger and a green one as poison or healing before the player processes anything else. Remember the wheel\\u2019s note: these are cultural conventions, not laws.'],
  f:['Los colores son como la música de fondo de una película: no te dicen nada con palabras, pero cambian cómo te sientes. Un cartel rojo te grita "¡mira aquí!", una habitación verde te calma y una oficina azul te pone en modo trabajo, sin que nadie diga nada.','Colours are like a film\\u2019s background music: they say nothing in words, but they change how you feel. A red sign shouts "look here!", a green room calms you, and a blue office puts you in work mode, without anyone saying a thing.']},
 {t:['Aditivo (luz) vs sustractivo (pigmento)','Additive (light) vs subtractive (pigment)'],
  b:['Con <b>luz</b> (pantallas, RGB) el color es <b>aditivo</b>: partes del negro y sumas luces; rojo+verde+azul = blanco. Con <b>pigmento</b> (pintura, CMYK) es <b>sustractivo</b>: partes del blanco y cada capa resta luz; mezclarlo todo tiende al negro. Por eso los primarios cambian. Para VFX vives en RGB, pero pensar en RYB te ayuda a componer.','With <b>light</b> (screens, RGB) colour is <b>additive</b>: start from black and add light; red+green+blue = white. With <b>pigment</b> (paint, CMYK) it\u2019s <b>subtractive</b>: start from white and each layer removes light; mixing everything tends to black. That\u2019s why primaries differ. For VFX you live in RGB, but thinking in RYB helps you compose.'],
  f:['Linternas de colores en una pared oscura: júntalas todas y se vuelve blanco (luz suma). Pinturas en un papel blanco: júntalas todas y se vuelve marrón-negro (pintura resta).','Coloured flashlights on a dark wall: combine them and it turns white (light adds). Paints on white paper: combine them and it turns brown-black (paint subtracts).']},
 {t:['Neutros','Neutrals'],
  b:['Beige, gris, marrón, negro y blanco casi no aparecen en la rueda, pero son el <b>pegamento</b> de una paleta: acompañan a cualquier color y calman las combinaciones fuertes. Un solo acento vivo sobre una base neutra suele lucir más que muchos colores a la vez.','Beige, grey, brown, black and white barely appear on the wheel, but they\u2019re the <b>glue</b> of a palette: they go with any colour and calm strong combinations. A single vivid accent over a neutral base often looks better than many colours at once.'],
  f:['Los neutros son el pan del bocadillo: no llaman la atención, pero sostienen todo lo demás y combinan con cualquier relleno.','Neutrals are the bread of a sandwich: they don\u2019t grab attention, but they hold everything together and go with any filling.']}
];
function ittenViz(cols){return '<div class="ittenrow">'+cols.map(function(c){return '<div style="background:'+c+'"></div>';}).join('')+'</div>';}
var ITTEN=[
 {t:['Contraste de tono','Contrast of hue'],
  b:['El más simple: juntar colores <b>puros y distintos</b> (rojo, amarillo, azul). Es llamativo, alegre y directo, típico de lo infantil o festivo.','The simplest: placing <b>pure, distinct</b> colours together (red, yellow, blue). Bold, cheerful and direct, typical of playful or festive looks.'],
  f:['Es como una caja de rotuladores recién abierta: cada color grita el suyo.','Like a fresh box of markers: each colour shouts its own.'],cols:['#EA1C1C','#F4D40E','#1C64D4','#2E9E4F']},
 {t:['Claro-oscuro','Light-dark'],
  b:['Contraste de <b>valor</b>: claro contra oscuro. Es el más importante para que algo se lea; manda por encima del color. Blanco y negro son su extremo.','<b>Value</b> contrast: light against dark. The most important for readability; it rules above hue. Black and white are its extreme.'],
  f:['De noche solo ves si algo es más claro o más oscuro que el fondo, aunque no distingas el color.','At night you only see if something is lighter or darker than the background, even without telling the colour.'],cols:['#0E1116','#3a4150','#7f8794','#c3c8d0','#F4F6FB']},
 {t:['Cálido-frío','Warm-cool'],
  b:['Cálidos (rojo, naranja) contra fríos (azul, cian). Da <b>sensación de profundidad</b>: lo cálido acerca, lo frío aleja. Base del "turquesa y naranja".','Warm (red, orange) against cool (blue, cyan). Creates <b>depth</b>: warm advances, cool recedes. Base of "teal and orange".'],
  f:['Una fogata naranja se siente cerca; una montaña azulada, lejos.','An orange campfire feels close; a bluish mountain feels far.'],cols:['#E0472A','#E8843D','#12A6A6','#1C64D4']},
 {t:['Complementarios','Complementary'],
  b:['Dos opuestos de la rueda. Se <b>refuerzan</b> mutuamente hasta el máximo brillo, pero mezclados dan gris. Máxima tensión y equilibrio.','Two opposites on the wheel. They <b>intensify</b> each other to peak vibrancy, yet mixed they turn grey. Maximum tension and balance.'],
  f:['Como dos imanes al revés: juntos empujan fuerte; pegados de golpe se anulan.','Like two reversed magnets: together they push hard; slammed together they cancel.'],cols:['#EA1C1C','#2E9E4F']},
 {t:['Contraste simultáneo','Simultaneous contrast'],
  b:['Un mismo gris parece <b>teñirse</b> del complementario del color que lo rodea. Tu ojo "inventa" el contraste. Es un efecto perceptivo, no físico.','The same grey seems to <b>take on</b> the complement of the colour around it. Your eye "invents" the contrast. A perceptual effect, not physical.'],
  f:['Un gris sobre rojo se ve algo verdoso; el mismo gris sobre verde, algo rojizo. El ojo te engaña.','A grey on red looks slightly greenish; the same grey on green, slightly reddish. The eye tricks you.'],cols:['#2E9E4F','#9a9a9a','#EA1C1C','#9a9a9a']},
 {t:['Contraste cualitativo','Contrast of saturation'],
  b:['Colores <b>vivos junto a apagados</b> (saturados frente a grisáceos). Un acento saturado sobre una base apagada destaca muchísimo.','<b>Vivid next to muted</b> colours (saturated vs greyish). A saturated accent over a muted base stands out strongly.'],
  f:['Una flor de color fuerte en un día gris de niebla: se la ve enseguida.','A brightly coloured flower on a grey foggy day: you spot it at once.'],cols:['#1C64D4','#6a7a92','#8a95a3','#a7aeb8']},
 {t:['Contraste cuantitativo','Contrast of extension'],
  b:['Es cuestión de <b>proporción</b>: cuánto de cada color. Mucho de uno y poco de otro cambia todo el efecto. Un pequeño acento manda más que un gran fondo.','It\u2019s about <b>proportion</b>: how much of each colour. A lot of one and a little of another changes the whole effect. A small accent commands more than a big background.'],
  f:['Una gota de rojo en un lienzo azul enorme atrae la mirada más que el azul entero.','A drop of red on a huge blue canvas draws the eye more than all the blue.'],cols:['#1C64D4','#1C64D4','#1C64D4','#1C64D4','#1C64D4','#1C64D4','#1C64D4','#EA1C1C']}
];
function renderTheory(){
 var cards=THEORY.map(function(c){
  var viz=c.viz?c.viz():'';
  return '<div class="tcard"><h3>'+esc(LANG==='es'?c.t[0]:c.t[1])+' <span class="en3">'+esc(LANG==='es'?c.t[1]:c.t[0])+'</span></h3>'
   +'<p>'+(LANG==='es'?c.b[0]:c.b[1])+'</p>'+viz
   +'<div class="feyn"><b>🧒 '+T('feynLabel')+':</b> '+(LANG==='es'?c.f[0]:c.f[1])+'</div></div>';
 }).join('');
 var itten=ITTEN.map(function(c){
  return '<div class="tcard"><h3>'+esc(LANG==='es'?c.t[0]:c.t[1])+' <span class="en3">'+esc(LANG==='es'?c.t[1]:c.t[0])+'</span></h3>'
   +'<p>'+(LANG==='es'?c.b[0]:c.b[1])+'</p>'+ittenViz(c.cols)
   +'<div class="feyn"><b>🧒 '+T('feynLabel')+':</b> '+(LANG==='es'?c.f[0]:c.f[1])+'</div></div>';
 }).join('');
 var ittenBlock='<div class="divider">'+T('ittenH')+'</div><p class="sub" style="margin:0 auto 16px">'+T('ittenIntro')+'</p>'+itten;
 var sources='<div class="sources"><b>'+T('sourcesH')+':</b> '
  +'Readymag — «Color theory basics: the color wheel» (blog.readymag.com); '
  +'Styling Scrapbook — «The Color Wheel and Color Theory» (2012); '
  +'Johannes Itten — «The Art of Color» (los 7 contrastes); '
  +'nombres y HEX de color: los ~140 nombres estándar CSS/HTML (W3C; véase también w3schools.com/colors) y referencias de color (colorui.io, color-hex.com); colecciones de paletas inspiradas en el explorador de Adobe Color. '
  +'La rueda tradicional (primarios RYB) se atribuye a Newton, Goethe e Itten.</div>';
 $('#theoryView').innerHTML='<div class="theory"><p class="sub" style="margin:0 auto 18px">'+T('theorySub')+'</p>'+cards+ittenBlock+sources+'</div>';
}

/* ============ ESTUDIAR (Leitner) ============ */
var KEY='color_wheel_v1',DAY=86400000,INT=[0,1,3,7,16];
var STORE={box:{},due:{}};
function loadStore(){return window.storage.get(KEY).then(function(r){if(r&&r.value){var o=JSON.parse(r.value);STORE.box=o.box||{};STORE.due=o.due||{};STORE.streak=o.streak||0;STORE.best=o.best||0;STORE.lastDay=o.lastDay||null;}}).catch(function(){});}
function saveStore(){try{window.storage.set(KEY,JSON.stringify(STORE));}catch(e){}}
function bumpStreak(){
 var today=new Date().toISOString().slice(0,10);
 if(STORE.lastDay===today)return;
 var y=new Date(Date.now()-864e5).toISOString().slice(0,10);
 STORE.streak=(STORE.lastDay===y)?(STORE.streak||0)+1:1;
 STORE.lastDay=today;
 if((STORE.streak||0)>(STORE.best||0))STORE.best=STORE.streak;
}
function grade(id,ok){var b=STORE.box[id]||0;b=ok?Math.min(4,b+1):0;STORE.box[id]=b;STORE.due[id]=Date.now()+INT[b]*DAY;bumpStreak();saveStore();}
var studyModes={name:true,comp:true,cat:true,temp:true,named:true,scheme:true,wcag:true,role:true,hunt:true,wheel:true},curCard=null,answered=false;
function renderStudyHome(){
 wakeOff();
 var modes=[['name',T('mName'),T('mNameS')],['comp',T('mComp'),T('mCompS')],['cat',T('mCat'),T('mCatS')],['temp',T('mTemp'),T('mTempS')],['named',T('mNamed'),T('mNamedS')],['scheme',T('mScheme'),T('mSchemeS')],['wcag',T('mWcag'),T('mWcagS')],['role',T('mRole'),T('mRoleS')],['hunt',T('mHunt'),T('mHuntS')],['wheel',T('mWheel'),T('mWheelS')]];
 var chips=modes.map(function(m){return '<button class="chip" aria-pressed="'+(studyModes[m[0]]?'true':'false')+'" onclick="toggleMode(\''+m[0]+'\')">'+m[1]+'<small>'+m[2]+'</small></button>';}).join('');
 var today=new Date().toISOString().slice(0,10);
 var liveStreak=(STORE.lastDay===today||STORE.lastDay===new Date(Date.now()-864e5).toISOString().slice(0,10))?(STORE.streak||0):0;
 var dw=function(n){return n===1?T('stDay1'):T('stDays');};
 var streakLine=(STORE.best||liveStreak)?'<p class="streakline">\ud83d\udd25 '+T('stStreak')+': <b>'+liveStreak+' '+dw(liveStreak)+'</b> \u00b7 '+T('stBest')+': <b>'+(STORE.best||0)+' '+dw(STORE.best||0)+'</b></p>':'';
 $('#studyView').innerHTML='<div class="study-home"><p class="sub" style="margin:0 auto 16px">'+T('studySub')+'</p>'+streakLine
  +'<div class="modes">'+chips+'</div><div style="text-align:center"><button class="sc-primary" style="border:none;border-radius:11px;padding:12px 26px;font-family:var(--disp);font-weight:600;font-size:15px" onclick="startStudy()">'+T('start')+'</button> <button class="btn" style="margin-left:8px" onclick="renderStudyStats()">'+T('statsBtn')+'</button></div></div>';
}
/* v52: la pantalla no se apaga a mitad de racha. Opcional y silencioso: si el
   navegador no lo soporta (o estamos en file:// sin permiso) no pasa nada. */
var wakeLock=null;
function wakeOn(){
 if(!('wakeLock' in navigator))return;
 navigator.wakeLock.request('screen').then(function(wl){wakeLock=wl;}).catch(function(){});
}
function wakeOff(){if(wakeLock){wakeLock.release().catch(function(){});wakeLock=null;}}
document.addEventListener('visibilitychange',function(){
 /* el sistema suelta el lock al ocultar la pestana: re-adquirir al volver si seguimos estudiando */

   Antes: solo se cerraban con clic fuera o en la X, no anunciaban su rol,
   no recibian el foco y con Tab se navegaba por detras del overlay.

   trampa de foco ciclica y devolucion del foco a quien lo abrio. */
var modalCloser=null,modalPrev=null;

 var sel='button:not([disabled]),a[href],input:not([disabled]),select:not([disabled]),textarea:not([disabled]),[tabindex]:not([tabindex="-1"])';

function modalKey(e){

 /* v57: durante la captura de un remapeo, la tecla es para la captura (Escape
    cancela la captura, no cierra el panel); el atrapa-focos descansa un golpe */
 if(window.kbCapture)return;
 if(e.key==='Escape'){e.preventDefault();e.stopPropagation();modalCloser();return;}
 if(e.key!=='Tab')return;
 var f=modalFocusables();if(!f.length)return;
 var first=f[0],last=f[f.length-1],a=document.activeElement;
 if(e.shiftKey&&(a===first||!document.querySelector('#pvHost').contains(a))){e.preventDefault();last.focus();}

}
/* html: contenido del modal. closer: funcion de cierre. label: texto para aria-label. */
function modalOpen(html,closer,label){

 if(fresh){modalPrev=document.activeElement;document.addEventListener('keydown',modalKey,true);}
 modalCloser=closer;

 var box=host.querySelector('.pvBox');
 if(box){
  box.setAttribute('role','dialog');
  box.setAttribute('aria-modal','true');

   var cs2=sp.get('cart').split('-').map(function(x){return normHex(x);}).filter(Boolean);
   if(cs2.length){
    var seen={},add=0;
    myPal.basket.forEach(function(b){seen[b.hex.toUpperCase()]=1;});
    cs2.forEach(function(c){var cu=c.toUpperCase();if(seen[cu])return;seen[cu]=1;myPal.basket.push({hex:cu,name:nearestName(cu)});add++;});

var mgPos=null,mgCount=0,mgStops=['#7E33AB','#1C64D4','#2E9E4F','#F4D40E'],mgMode='css';
function mgColors(){return mgStops.map(function(x){return x.toUpperCase();});}
function ensureMg(){var c=mgColors();if(!mgPos||mgCount!==c.length){mgCount=c.length;mgPos=c.map(function(){return [Math.round(Math.random()*100),Math.round(Math.random()*100)];});}return c;}

/* Mezcla en OKLab por ponderacion inversa a la distancia (v47).
   El CSS apila radial-gradients que se desvanecen a `transparent`, es decir a negro
   transparente en sRGB: al mezclarse, los solapes pierden claridad y aparecen zonas
   sucias. Aqui cada pixel es la media ponderada de los focos en OKLab, que es
   independiente del orden y conserva la claridad. */
var MG_POW=2.6;
function mgLabStops(){return mgColors().map(hexToOklab);}
/* conversion rapida: si el color cae en gama se escribe directo; si no, se delega en
   oklchToHex, que reduce el croma sin desviar el matiz (recortar canales si lo desvia) */
function okLabToRgb255(L,a,b,out,o){
 var v=oklabLinRgb(L,a,b);
 if(!okInGamut(v)){
  var C=Math.sqrt(a*a+b*b),h=(C<1e-4)?0:Math.atan2(b,a)*180/Math.PI;
  var hx=oklchToHex(L,C,h),c=rgbOf(hx);
  out[o]=c.r;out[o+1]=c.g;out[o+2]=c.b;return;
 }
 for(var i=0;i<3;i++)out[o+i]=Math.max(0,Math.min(255,Math.round(linSrgbF(Math.max(0,Math.min(1,v[i]))) *255)));
}
function mgPaintCtx(ctx,W,H){
 ensureMg();
 var labs=mgLabStops(),n=labs.length,img=ctx.createImageData(W,H),d=img.data;
 var px=mgPos.map(function(p){return [p[0]/100,p[1]/100];});
 for(var y=0;y<H;y++){var fy=H===1?0:y/(H-1);
  for(var x=0;x<W;x++){var fx=W===1?0:x/(W-1),i,wsum=0,L=0,A=0,B=0;
   for(i=0;i<n;i++){
    var dx=fx-px[i][0],dy=fy-px[i][1];
    var d2=dx*dx+dy*dy;
    var wgt=1/(Math.pow(d2,MG_POW/2)+1e-6);
    wsum+=wgt;L+=labs[i].L*wgt;A+=labs[i].a*wgt;B+=labs[i].b*wgt;
   }
   var o=(y*W+x)*4;
   okLabToRgb255(L/wsum,A/wsum,B/wsum,d,o);
   d[o+3]=255;
  }
 }
 ctx.putImageData(img,0,0);
}

function cmykStr(hex){

 var C=(1-r-k)/(1-k),M=(1-g-k)/(1-k),Y=(1-b-k)/(1-k);

function cvParse(txt){
 txt=(txt||'').trim();if(!txt)return null;
 var h=normHex(txt);if(h)return h;
 var m=txt.match(/rgba?\(\s*(\d{1,3})[\s,]+(\d{1,3})[\s,]+(\d{1,3})/i);
 if(m){var r=Math.min(255,+m[1]),g=Math.min(255,+m[2]),b=Math.min(255,+m[3]);return ('#'+toHex(r)+toHex(g)+toHex(b)).toUpperCase();}

 if(m)return hslToHex(+m[1]%360,Math.min(100,+m[2]),Math.min(100,+m[3])).toUpperCase();

/* Fallback de almacenamiento (v53). Donde existe window.storage (artefactos de
   Claude) no se toca nada. Fuera —la PWA desplegada, un doble clic en file://—
   el shim persiste en localStorage con prefijo 'cw:'. Si localStorage no está
   disponible o está lleno (modo privado de Safari, cuotas), degrada a memoria
   sin romper nada: el espejo en memoria es siempre la fuente de lectura. */
if(!window.storage){(function(){
 var m={},P='cw:',ls=null;
 try{ls=window.localStorage;var t='cw:__t';ls.setItem(t,'1');ls.removeItem(t);}catch(e){ls=null;}
 if(ls){try{for(var i=0;i<ls.length;i++){var k=ls.key(i);if(k&&k.indexOf(P)===0)m[k.slice(P.length)]=ls.getItem(k);}}catch(e){window.__storeReadOk=false;/* v87: la carga del espejo falló con localStorage presente → lectura no fiable */}}
 function persist(k,v){if(!ls)return;try{if(v===undefined)ls.removeItem(P+k);else ls.setItem(P+k,v);}catch(e){}}
 window.__rung=ls?'localStorage':'memoria';
 window.storage={
  get:function(k){return Promise.resolve(m.hasOwnProperty(k)?{key:k,value:m[k]}:null);},
  set:function(k,v){m[k]=v;persist(k,v);return Promise.resolve({key:k,value:v});},
  delete:function(k){delete m[k];persist(k,undefined);return Promise.resolve({key:k,deleted:true});},
  list:function(){return Promise.resolve({keys:Object.keys(m)});}};
})();}

DIAG.rung=window.__rung||'window.storage';
(function(){var _s=window.storage.set.bind(window.storage);window.storage.set=function(k,v){return Promise.resolve().then(function(){return _s(k,v);}).then(function(r){DIAG.saves++;return r;},function(e){DIAG.lastError=diagNow()+' \u2014 '+String(e&&e.message||e);return null;});};})();

   Medido con sondas_v87.js: si la lectura falla al arrancar, un solo guardado
   perd\u00eda 6 de 7 cosas. Aqu\u00ed: hasta que la lectura inicial no se confirma buena,
   NO se persisten las claves de datos; si la lectura fall\u00f3, se avisa con salidas
   reales (Reintentar / Empezar de cero) en vez de pisar en silencio. */

   try{DIAG.lastError=(typeof diagNow==='function'?diagNow()+' \u2014 ':'')+'guardado en pausa (lectura no confirmada): '+k;}catch(e){}
   return Promise.resolve({key:k,value:v,blocked:true});

 if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){
  navigator.serviceWorker.register('./sw.js?v='+APP_VERSION).then(function(reg){
   /* v53: aviso de versión nueva. El sw.js nuevo se instala solo (skipWaiting),
      pero la página en marcha sigue siendo la vieja hasta recargar: se ofrece
      el botón en cuanto el worker nuevo queda instalado habiendo ya uno en
      control (primera instalación = sin aviso). */
   function offer(){
    if(document.getElementById('updBar'))return;
    var d=document.createElement('div');d.className='updbar';d.id='updBar';d.setAttribute('role','status');
    d.innerHTML='<span>'+T('swUpd')+'</span><button onclick="location.reload()">'+T('swReload')+'</button>';
    document.body.appendChild(d);
   }
   /* nota: NO se comprueba reg.waiting al cargar — con skipWaiting es un estado
      transitorio que solo se pilla durante la carrera de activación (justo al
      recargar) y producía una barra fantasma con la versión ya al día */
   reg.addEventListener('updatefound',function(){
    var nw=reg.installing;if(!nw)return;
    nw.addEventListener('statechange',function(){
     if(nw.state==='installed'&&navigator.serviceWorker.controller)offer();
    });
   });
  }).catch(function(){});
 }
 try{
  var q=new URLSearchParams(location.search);
  /* atajos del manifest y enlaces directos: ?tab=study|pal|... */
  var qt=q.get('tab');
  if(qt){var tb=document.querySelector('#tabs .tab[data-tab="'+qt.replace(/[^a-z]/g,'')+'"]');if(tb)tb.click();}
  /* imagen compartida desde Android (share_target): el SW la deja en la cache
     'share-inbox' y redirige aqui con ?shared=1 */
  if(q.get('shared')==='1'&&'caches' in window){
   caches.open('share-inbox').then(function(c){return c.match('shared-image');}).then(function(res){
    if(!res)return;
    return res.blob().then(function(blob){
     var tb2=document.querySelector('#tabs .tab[data-tab="pal"]');if(tb2)tb2.click();
     PC.mode='image';renderPal();
     pcImageFile(new File([blob],'shared.png',{type:blob.type||'image/png'}));
     return caches.open('share-inbox').then(function(c){return c.delete('shared-image');});
    });
   }).catch(function(){});
  }
  if(qt||q.get('shared'))history.replaceState(null,'',location.pathname+location.hash);
 }catch(e){}
})();
</script>
